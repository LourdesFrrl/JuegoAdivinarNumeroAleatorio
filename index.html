<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adivina el número</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5 text-center">
    <h1 class="mb-4">🎯 Adivina el número</h1>
    <button id="btnGenerarNumero" class="btn btn-success mb-4">Comenzar el juego</button>

    <form id="formAdivinar" class="w-50 mx-auto">
      <div class="mb-3 text-start">
        <label for="numeroIngresado" class="form-label">Ingrese el número</label>
        <input type="number" class="form-control" id="numeroIngresado" required>
      </div>
      <button id="botonEnviar" type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>
  <script src="./JS/juego.js"></script>

</body>
</html>
